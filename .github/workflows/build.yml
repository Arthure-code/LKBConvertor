name: Build Android + SonarCloud

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud a besoin de tout l'historique pour blame

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools/dotnet-sonarscanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: SonarCloud - Begin analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Arthure-code_LKBConvertor" \
            /o:"arthuredevsecops" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/Platforms/**/Resources/**,**/*.g.cs,**/Resources/Fonts/**,**/Resources/Images/**" \
            /d:sonar.coverage.exclusions="**/Views/**,**/Platforms/**"

      - name: Restore
        run: dotnet restore LKBConvertor/LKBConvertor/LKBConvertor.csproj -p:RuntimeIdentifiers=android-arm64

      - name: Build Release
        run: dotnet build LKBConvertor/LKBConvertor/LKBConvertor.csproj -c Release -f net9.0-android --no-restore -p:RuntimeIdentifiers=android-arm64

      - name: SonarCloud - End analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
